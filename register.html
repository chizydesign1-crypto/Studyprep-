
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration | StudyPrep</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="registration">

        <div class="registration-container">

            <h1>Join StudyPrep</h1>

            <p>
                Create your account and begin your journey
                towards academic excellence.
            </p>

            <form id="registrationForm">

                <label for="fullname">Full Name</label>
                <input
                    type="text"
                    id="fullname"
                    placeholder="Enter your full name"
                    required
                >
           
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">Password</label>

<div class="password-box">
    <input
        type="password"
        id="password"
        placeholder="Create a password"
        required
    >

    <button type="button" class="toggle-password"
        onclick="togglePassword('password', this)">
        👁️
    </button>
</div>
     
                <label for="confirmPassword">Confirm Password</label>

<div class="password-box">
    <input
        type="password"
        id="confirmPassword"
        placeholder="Enter your password again"
        required
    >

    <button type="button" class="toggle-password"
        onclick="togglePassword('confirmPassword', this)">
        👁
    </button>
</div>

<!-- CLASS SELECTION -->

<label for="studentClass">Select Your Class</label>

<select id="studentClass" required>
    <option value="">Choose your class</option>
    <option value="SS1">SS1</option>
    <option value="SS2">SS2</option>
    <option value="SS3">SS3</option>
</select>


<!-- DEPARTMENT SELECTION -->

<label for="department">Select Your Department</label>

<select id="department" required>
    <option value="">Choose your department</option>
    <option value="Science">Science</option>
    <option value="Arts">Arts</option>
    <option value="Commercial">Commercial</option>
</select>

<!-- SUBJECT SELECTION SECTION -->

<div id="subjectsSection" style="display: none;">

    <h3>Select Your Subjects</h3>

    <p>Choose the subjects you are preparing for:</p>

    <div id="subjectsList"></div>

</div>


<!-- EXAMINATION GOALS -->

<div class="exam-options">

  <label class="exam-option">
    WAEC
    <input type="checkbox" name="exams" value="WAEC">
  </label>

  <label class="exam-option">
    NECO
    <input type="checkbox" name="exams" value="NECO">
  </label>

  <label class="exam-option">
    JAMB
    <input type="checkbox" name="exams" value="JAMB">
  </label>

  <label class="exam-option">
    General Learning (No external examination)
    <input type="checkbox" name="exams" value="General Learning">
  </label>

</div>
<button type="submit" class="continue-btn">
    Continue
</button>
</form>

        </div>

    </section>

    <script src="script.js"></script>

</body>
</html>
